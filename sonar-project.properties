# sonar.verbose=true
# The CI (onecx/ci-angular, SonarCloud) scans with sonarqube-scanner; sonar:all and sonar:staged use it as a pinned devDependency.
# host and token are not stored here, set them in the environment:
#   export SONAR_HOST_URL=https://sonarcloud.io SONAR_TOKEN=<token>   (SONAR_HOST_URL defaults to sonarcloud.io for sonar:staged)
#   npm run sonar:all      whole project (works against any SonarQube/SonarCloud)
#   npm run sonar:staged   only staged, new code; needs a server with pull-request analysis
#                          (SonarCloud or SonarQube Developer Edition+, not Community Edition)
#
sonar.verbose=false
#
sonar.organization=onecx
sonar.projectKey=onecx_onecx-shell-ui
sonar.projectName=onecx-shell-ui
#
sonar.scm.disabled=true
sonar.sources=src
sonar.tests=src
sonar-language="js"
sonar.sourceEncoding=UTF-8
#
# reporting
sonar.javascript.coveragePlugin=lcov
sonar.javascript.lcov.reportPaths=./reports/coverage/lcov.info
sonar.testExecutionReportPaths=./reports/sonarqube_report.xml
sonar.working.directory=./reports/.scannerwork
# files
sonar.exclusions=src/app/shared/generated/**/*,pre_loaders/**/*,src/scope-polyfill/*
sonar.cpd.exclusions=src/**/*.ts,src/**/*.html"
sonar.coverage.exclusions=*.ts,*.js,*.json,*.properties,src/*.ts,helm/**/*,src/*.ico,src/**/*.module.ts,src/**/*.main.ts,src/**/*.bootstrap.ts,src/environments/*,src/assets/**/*,src/app/*,src/app/shared/generated/**/*,pre_loaders/**/*,src/scope-polyfill/*
sonar.test.inclusions=src/app/**/*.spec.ts
#
# issue exceptions
sonar.issue.ignore.multicriteria=e1
# ignore rule to allow async actions inside constructors
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7059
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts
