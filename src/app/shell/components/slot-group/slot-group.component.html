<ocx-slot
  class="flex align-items-center"
  [name]="name() + '.start'"
  [style]="slotStyles()"
  [class]="computedSlotClasses()"
  [class.flex-1]="applyCenterAlignment()"
  [inputs]="slotInputsStart()"
  [outputs]="slotOutputs()"
></ocx-slot>
<ocx-slot
  class="flex align-items-center flex-grow-1"
  [name]="name() + '.center'"
  [style]="slotStyles()"
  [class]="computedSlotClasses()"
  [class.justify-content-center]="applyCenterAlignment()"
  [inputs]="slotInputsCenter()"
  [outputs]="slotOutputs()"
></ocx-slot>
<ocx-slot
  class="flex align-items-center"
  [name]="name() + '.end'"
  [style]="slotStyles()"
  [class]="computedSlotClasses()"
  [class.flex-1]="applyCenterAlignment()"
  [class.justify-content-end]="applyCenterAlignment()"
  [inputs]="slotInputsEnd()"
  [outputs]="slotOutputs()"
></ocx-slot>
