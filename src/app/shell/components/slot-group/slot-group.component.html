<ocx-slot
  class="flex align-items-center"
  [name]="name() + '.start'"
  [style]="slotStyles()"
  [class]="computedSlotClasses() + ' ' + slotAlignmentClasses().start"
  [class.flex-1]="applyCenterAlignment()"
  [inputs]="slotInputsStart()"
  [outputs]="slotOutputs()"
></ocx-slot>
<ocx-slot
  class="flex align-items-center flex-grow-1"
  [name]="name() + '.center'"
  [style]="slotStyles()"
  [class]="computedSlotClasses() + ' ' + slotAlignmentClasses().center"
  [inputs]="slotInputsCenter()"
  [outputs]="slotOutputs()"
></ocx-slot>
<ocx-slot
  class="flex align-items-center"
  [name]="name() + '.end'"
  [style]="slotStyles()"
  [class]="computedSlotClasses() + ' ' + slotAlignmentClasses().end"
  [class.flex-1]="applyCenterAlignment()"
  [inputs]="slotInputsEnd()"
  [outputs]="slotOutputs()"
></ocx-slot>
