<ocx-slot
  class="flex items-center"
  [name]="name() + '.start'"
  [style]="slotStyles()"
  [class]="computedSlotClasses()"
  [inputs]="slotInputsStart()"
  [outputs]="slotOutputs()"
></ocx-slot>
<ocx-slot
  class="flex items-center grow"
  [name]="name() + '.center'"
  [style]="slotStyles()"
  [class]="computedSlotClasses()"
  [inputs]="slotInputsCenter()"
  [outputs]="slotOutputs()"
></ocx-slot>
<ocx-slot
  class="flex items-center"
  [name]="name() + '.end'"
  [style]="slotStyles()"
  [class]="computedSlotClasses()"
  [inputs]="slotInputsEnd()"
  [outputs]="slotOutputs()"
></ocx-slot>
