@if (!globalErrMsg) {
<div class="onecx-viewport-wrapper">
  @if (themeService.currentTheme$ | async) {
  <!-- Header slot group -->
  <!-- Exposed as banner only when the header slots have content -->
  <header class="onecx-header" id="ocx_header" [attr.role]="(headerHasContent$ | async) ? null : 'none'">
    <div [style.width]="'100%'">
      <ocx-shell-slot-group
        name="onecx-shell-header"
        direction="row"
        [slotInputs]="slotHeaderInputs"
        [slotOutputs]="slotHeaderOutputs"
      ></ocx-shell-slot-group>
    </div>
  </header>

  <!-- SubHeader slot group -->
  <ocx-shell-slot-group class="onecx-subheader" name="onecx-shell-sub-header"></ocx-shell-slot-group>
  <div class="onecx-body-wrapper">
    <!-- BodyStart slot group (holds the menu), exposed as navigation only when it has content -->
    <ocx-shell-slot-group
      class="onecx-body-start"
      name="onecx-shell-body-start"
      direction="column"
      [attr.role]="(menuHasContent$ | async) ? 'navigation' : null"
      [attr.aria-label]="(menuHasContent$ | async) ? ('SHELL_LANDMARKS.MAIN_NAVIGATION' | translate) : null"
    ></ocx-shell-slot-group>
    <div class="onecx-body-center">
      <!-- BodyHeader slot group -->
      <ocx-shell-slot-group class="onecx-body-header" name="onecx-shell-body-header"></ocx-shell-slot-group>
      <div class="onecx-body">
        @if (!routesService || (routesService.showContent$ | async)) {
        <router-outlet></router-outlet>
        } @else {
        <ocx-shell-loading-spinner></ocx-shell-loading-spinner>
        }
      </div>
      <!-- BodyFooter slot group (legacy footer slots are mapped here), the contentinfo unless the footer slot group has content -->
      <ocx-shell-slot-group
        class="onecx-body-footer"
        name="onecx-shell-body-footer"
        [attr.role]="(bodyFooterIsContentInfo$ | async) ? 'contentinfo' : null"
      ></ocx-shell-slot-group>
    </div>
    <!-- BodyEnd slot group -->
    <ocx-shell-slot-group class="onecx-body-end" name="onecx-shell-body-end" direction="column"></ocx-shell-slot-group>
  </div>

  <!-- Footer slot group, not displayed without content -->
  @if (footerHasContent$ | async) {
  <footer>
    <ocx-shell-slot-group name="onecx-shell-footer"></ocx-shell-slot-group>
  </footer>
  } } @else {
  <div class="onecx-no-theme-main">
    <div class="onecx-no-theme-content relative">
      <router-outlet></router-outlet>
    </div>
  </div>
  }
</div>
} @else {
<ocx-shell-error [errCode]="globalErrMsg"></ocx-shell-error>
}

<!-- Extensions slot for adding custom functionality -->
<ocx-slot class="extensions-slot" name="onecx-shell-extensions"></ocx-slot>
