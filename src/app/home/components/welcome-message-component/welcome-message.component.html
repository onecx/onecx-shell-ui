<!-- Mirrors the layout of the welcome-overview component in onecx-welcome -->
<div class="p-3">
  <div class="sm:px-2 flex flex-column gap-2 sm:gap-3">
    <h1 id="wc_overview_info_title" class="m-0 font-normal text-xl sm:text-2xl md:text-4xl">
      {{ 'WELCOME.TITLE' | translate }} {{ (user$ | async)?.person?.firstName }}
    </h1>
    <p id="wc_overview_info_workspace" class="m-0 text-sm sm:text-base">
      {{ 'WELCOME.WORKSPACE' | translate }} {{ (workspace$ | async)?.displayName }}
    </p>
  </div>
</div>
