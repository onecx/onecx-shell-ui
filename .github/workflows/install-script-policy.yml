name: Install Script Policy

# Focused npm 12 check of the dependency install-script policy of the root
# project and all pre-loader projects. The reusable "Build Pull Request"
# workflow stays the full application build.
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'pre_loaders/*/*'
      - 'create-dummies.js'
      - 'build-preloaders.sh'
      - '.github/scripts/verify-install-script-policy.js'
      - '.github/workflows/install-script-policy.yml'

permissions:
  contents: read

jobs:
  npm-12:
    name: npm 12 install-script policy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install latest npm 12
        run: |
          npm install --global npm@12
          npm --version

      - name: Reject blanket, wildcard, name-only and global approvals
        run: node .github/scripts/verify-install-script-policy.js

      - name: Install root and pre-loaders (root postinstall)
        run: npm ci

      - name: Build all pre-loaders
        run: npm run prebuild

      - name: Reject an unreviewed scripted dependency
        run: |
          probe_dir="$RUNNER_TEMP/unreviewed-script-probe"
          mkdir -p "$probe_dir"
          cat > "$probe_dir/package.json" <<'EOF'
          {
            "name": "unreviewed-script-probe",
            "version": "1.0.0",
            "scripts": { "postinstall": "node -e \"process.exit(0)\"" }
          }
          EOF
          npm pack "$probe_dir" --pack-destination "$RUNNER_TEMP"
          probe="$RUNNER_TEMP/unreviewed-script-probe-1.0.0.tgz"

          for project in . pre_loaders/*/; do
            echo "Checking $project"
            if (cd "$project" && npm install --no-save "$probe") > "$RUNNER_TEMP/probe.log" 2>&1; then
              echo "::error::$project installed a dependency with an unreviewed install script"
              exit 1
            fi
            if ! grep -q ESTRICTALLOWSCRIPTS "$RUNNER_TEMP/probe.log"; then
              cat "$RUNNER_TEMP/probe.log"
              echo "::error::$project install failed without ESTRICTALLOWSCRIPTS"
              exit 1
            fi
          done
